<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemberitahuan - Pemeliharaan Sistem</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .badge {
      display: inline-block;
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
      padding: 0.35rem 1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(234, 179, 8, 0.3);
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .status-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 1rem;
      text-align: left;
      font-size: 0.85rem;
      color: #cbd5e1;
      border-left: 4px solid #3b82f6;
    }
    .status-box strong {
      color: #60a5fa;
      display: block;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">⚙️ Perombakan Sistem</div>
    <h1>Web Sedang Dalam Pemeliharaan</h1>
    <p>Kami sedang melakukan perombakan besar-besaran pada platform untuk menghadirkan performa dan fitur baru yang lebih optimal. Mohon maaf atas ketidaknyamanannya.</p>
    
    <div class="status-box">
      <strong>Status Pembaruan:</strong>
      Migrasi arsitektur ke sistem baru sedang berlangsung.
    </div>
  </div>

</body>
</html>
